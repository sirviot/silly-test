<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather Visualizer</title>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-deep:   #0d0d1a;
      --bg-panel:  #1a1a2e;
      --bg-card:   #16213e;
      --accent:    #4cc9f0;
      --accent2:   #7209b7;
      --text:      #e0e0f0;
      --text-dim:  #8888aa;
      --border:    #2a2a4a;
      --sidebar-w: 280px;
      --chart-h:   220px;
    }

    html, body {
      height: 100%;
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg-deep);
      color: var(--text);
      overflow: hidden;
    }

    /* ── Layout shell ── */
    #shell {
      display: grid;
      grid-template-columns: var(--sidebar-w) 1fr;
      grid-template-rows: 1fr var(--chart-h);
      height: 100vh;
    }

    /* ── Sidebar ── */
    #sidebar {
      grid-row: 1 / 3;
      background: var(--bg-panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #sidebar-header {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-card);
    }

    #sidebar-header h1 {
      font-size: 1rem;
      font-weight: 600;
      color: var(--accent);
      letter-spacing: 0.05em;
    }

    #sidebar-header p {
      font-size: 0.7rem;
      color: var(--text-dim);
      margin-top: 2px;
    }

    #sidebar-body {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .ctrl-group { display: flex; flex-direction: column; gap: 6px; }

    label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-dim);
    }

    select, input[type="range"] {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 0.82rem;
      appearance: none;
    }

    select:focus { outline: 2px solid var(--accent); }

    input[type="range"] {
      padding: 0;
      height: 6px;
      cursor: pointer;
      accent-color: var(--accent);
    }

    #time-label {
      font-size: 0.75rem;
      color: var(--accent);
      text-align: center;
      min-height: 1.1em;
    }

    #legend-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    #legend-box span {
      font-size: 0.72rem;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    #legend-img {
      max-width: 100%;
      border-radius: 6px;
      border: 1px solid var(--border);
    }

    #status-bar {
      padding: 8px 14px;
      font-size: 0.72rem;
      color: var(--text-dim);
      border-top: 1px solid var(--border);
      background: var(--bg-card);
    }

    /* ── Map ── */
    #map {
      position: relative;
      background: #111;
    }

    #map-spinner {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: none;
      z-index: 9999;
      background: rgba(13,13,26,0.75);
      border-radius: 8px;
      padding: 10px 18px;
      font-size: 0.8rem;
      color: var(--accent);
      pointer-events: none;
    }

    /* ── Chart panel ── */
    #chart-panel {
      background: var(--bg-panel);
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 10px 16px 8px;
    }

    #chart-title {
      font-size: 0.75rem;
      color: var(--text-dim);
      margin-bottom: 6px;
    }

    #chart-wrap {
      flex: 1;
      position: relative;
    }

    #timechart { width: 100% !important; height: 100% !important; }

    #no-data-msg {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      color: var(--text-dim);
    }

    /* ── Info panel ── */
    #info-panel {
      border-top: 1px solid var(--border);
    }

    #info-toggle {
      width: 100%;
      background: var(--bg-card);
      border: none;
      border-bottom: 1px solid var(--border);
      color: var(--text-dim);
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 8px 14px;
      text-align: left;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #info-toggle:hover { color: var(--accent); }

    #info-toggle .arrow { transition: transform 0.2s; }
    #info-toggle.open .arrow { transform: rotate(180deg); }

    #info-body {
      display: none;
      padding: 10px 14px 14px;
      font-size: 0.75rem;
      line-height: 1.7;
      overflow-y: auto;
      max-height: 280px;
    }

    #info-body.open { display: block; }

    .info-row {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      border-bottom: 1px solid var(--border);
      padding: 3px 0;
    }

    .info-row:last-child { border-bottom: none; }

    .info-key { color: var(--text-dim); flex-shrink: 0; }
    .info-val { color: var(--text); text-align: right; word-break: break-all; }

    /* Leaflet dark tile adjustments */
    .leaflet-tile { filter: brightness(0.85) saturate(0.7); }
  </style>
</head>
<body>

<div id="shell">
  <aside id="sidebar">
    <div id="sidebar-header">
      <h1>Weather Visualizer</h1>
      <p>GRIB2 data explorer</p>
    </div>

    <div id="sidebar-body">
      <div class="ctrl-group">
        <label for="var-select">Variable</label>
        <select id="var-select">
          <option value="">— loading —</option>
        </select>
      </div>

      <div class="ctrl-group" id="time-ctrl" style="display:none">
        <label for="time-slider">Time step</label>
        <input type="range" id="time-slider" min="0" max="0" value="0" />
        <div id="time-label"></div>
      </div>

      <div class="ctrl-group">
        <div id="legend-box">
          <span>Legend</span>
          <img id="legend-img" src="" alt="legend" style="display:none" />
        </div>
      </div>
    </div>

    <div id="info-panel">
      <button id="info-toggle"><span>Data info</span><span class="arrow">▾</span></button>
      <div id="info-body"></div>
    </div>

    <div id="status-bar">Click the map to query a point.</div>
  </aside>

  <div id="map">
    <div id="map-spinner">Rendering…</div>
  </div>

  <div id="chart-panel">
    <div id="chart-title">Click the map to see a timeseries at that point.</div>
    <div id="chart-wrap">
      <canvas id="timechart"></canvas>
      <div id="no-data-msg">No data — click a point on the map</div>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>

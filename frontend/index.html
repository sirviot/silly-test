<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather Visualizer</title>

  <!-- Cesium — CESIUM_BASE_URL must be set before the script loads -->
  <script>window.CESIUM_BASE_URL = "https://cesium.com/downloads/cesiumjs/releases/1.118/Build/Cesium/";</script>
  <link rel="stylesheet" href="https://cesium.com/downloads/cesiumjs/releases/1.118/Build/Cesium/Widgets/widgets.css" />
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.118/Build/Cesium/Cesium.js"></script>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-deep:   #0d0d1a;
      --bg-panel:  #1a1a2e;
      --bg-card:   #16213e;
      --accent:    #4cc9f0;
      --accent2:   #7209b7;
      --text:      #e0e0f0;
      --text-dim:  #8888aa;
      --border:    #2a2a4a;
      --sidebar-w:   250px;
      --chart-h:     170px;
      --gap:         14px;  /* margin from viewport edge for all panels */
      --sidebar-gap: 44px;  /* keeps sidebar clear of the Cesium credit bar at bottom-left */

      /* Shared glass panel style — applied via class */
      --glass-bg:     rgba(13, 13, 26, 0.82);
      --glass-border: rgba(255, 255, 255, 0.07);
      --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      --glass-radius: 12px;
    }

    html, body {
      height: 100%;
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #000;
      color: var(--text);
      overflow: hidden;
    }

    /* ── Globe — fills the entire viewport, sits behind panels ── */
    #globe {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    /* ── Floating panel base — applied to sidebar and chart panel ── */
    .panel {
      position: fixed;
      z-index: 100;
      background: var(--glass-bg);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--glass-border);
      border-radius: var(--glass-radius);
      box-shadow: var(--glass-shadow);
    }

    /* ── Legend — top-left floating panel ── */
    #legend-panel {
      top:     var(--sidebar-gap);
      left:    var(--gap);
      width:   fit-content;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 12px 14px;
    }

    #legend-panel > span {
      font-size: 0.85rem;
      color: var(--text);
      letter-spacing: 0.04em;
    }

    /* ── Sidebar — bottom-left floating panel (controls + info only) ── */
    #sidebar {
      left:   var(--gap);
      bottom: var(--sidebar-gap);
      width:  var(--sidebar-w);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #sidebar-header {
      padding: 16px;
      border-bottom: 1px solid var(--glass-border);
      background: rgba(22, 33, 62, 0.6);
      border-radius: var(--glass-radius) var(--glass-radius) 0 0;
      flex-shrink: 0;
    }

    #sidebar-header h1 {
      font-size: 1rem;
      font-weight: 600;
      color: var(--accent);
      letter-spacing: 0.05em;
    }

    #sidebar-header p {
      font-size: 0.7rem;
      color: var(--text-dim);
      margin-top: 2px;
    }

    #sidebar-body {
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .ctrl-group { display: flex; flex-direction: column; gap: 6px; }

    label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-dim);
    }

    select, input[type="range"] {
      width: 100%;
      background: rgba(22, 33, 62, 0.7);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 0.82rem;
      appearance: none;
    }

    select:focus { outline: 2px solid var(--accent); }

    input[type="range"] {
      padding: 0;
      height: 6px;
      cursor: pointer;
      accent-color: var(--accent);
    }

    #time-label {
      font-size: 0.75rem;
      color: var(--accent);
      text-align: center;
      min-height: 1.1em;
    }

    #legend-img {
      max-height: 280px;
      width: auto;
      border-radius: 4px;
      border: 1px solid var(--border);
    }

    #status-bar {
      padding: 8px 14px;
      font-size: 0.72rem;
      color: var(--text-dim);
      border-top: 1px solid var(--glass-border);
      background: rgba(22, 33, 62, 0.6);
      border-radius: 0 0 var(--glass-radius) var(--glass-radius);
      flex-shrink: 0;
    }

    /* ── Info panel ── */
    #info-panel {
      border-top: 1px solid var(--glass-border);
      flex-shrink: 0;
    }

    #info-toggle {
      width: 100%;
      background: none;
      border: none;
      border-bottom: 1px solid transparent;
      color: var(--text-dim);
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 8px 14px;
      text-align: left;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #info-toggle:hover { color: var(--accent); }

    #info-toggle.open { border-bottom-color: var(--glass-border); }

    #info-toggle .arrow { transition: transform 0.2s; }
    #info-toggle.open .arrow { transform: rotate(180deg); }

    #info-body {
      display: none;
      padding: 10px 14px 14px;
      font-size: 0.75rem;
      line-height: 1.7;
      overflow-y: auto;
      max-height: 220px;
    }

    #info-body.open { display: block; }

    .info-row {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      border-bottom: 1px solid rgba(42, 42, 74, 0.6);
      padding: 3px 0;
    }

    .info-row:last-child { border-bottom: none; }

    .info-key { color: var(--text-dim); flex-shrink: 0; }
    .info-val { color: var(--text); text-align: right; word-break: break-all; }

    /* ── Chart panel — bottom-right floating panel, hidden until data arrives ── */
    #chart-panel {
      bottom:  var(--sidebar-gap);
      left:    calc(var(--sidebar-w) + var(--gap) * 2);
      right:   var(--gap);
      height:  var(--chart-h);
      display: none;          /* shown by JS when chart data is available */
      flex-direction: column;
      padding: 10px 16px 10px;
    }

    #chart-close {
      position: absolute;
      top: 6px;
      right: 8px;
      background: none;
      border: none;
      color: var(--text-dim);
      font-size: 1.1rem;
      line-height: 1;
      cursor: pointer;
      padding: 2px 4px;
      border-radius: 4px;
    }

    #chart-close:hover { color: var(--accent); }

    #chart-title {
      font-size: 0.75rem;
      color: var(--text-dim);
      margin-bottom: 6px;
      flex-shrink: 0;
    }

    #chart-wrap {
      flex: 1;
      position: relative;
      min-height: 0;
    }

    #timechart { width: 100% !important; height: 100% !important; }

    #no-data-msg {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      color: var(--text-dim);
    }

    /* ── Spinner — centered in globe ── */
    #map-spinner {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: none;
      z-index: 50;
      background: rgba(13, 13, 26, 0.85);
      border: 1px solid var(--glass-border);
      border-radius: 8px;
      padding: 10px 18px;
      font-size: 0.8rem;
      color: var(--accent);
      pointer-events: none;
      backdrop-filter: blur(8px);
    }

    /* ── Download panel — top-right floating panel ── */
    #download-panel {
      top:   var(--sidebar-gap);
      right: var(--gap);
      width: 290px;
    }

    #dl-toggle {
      width: 100%;
      background: none;
      border: none;
      color: var(--accent);
      font-size: 0.88rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      padding: 12px 14px;
      text-align: left;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #dl-toggle:hover { opacity: 0.8; }
    #dl-toggle .arrow { transition: transform 0.2s; font-weight: 400; }
    #dl-toggle.open .arrow { transform: rotate(180deg); }

    #dl-body {
      padding: 0 14px 14px;
      display: none;
      flex-direction: column;
      gap: 10px;
      border-top: 1px solid var(--glass-border);
    }

    #dl-body.open { display: flex; }

    #dl-gentime, #dl-param-info {
      font-size: 0.72rem;
      color: var(--text-dim);
      min-height: 1em;
    }

    #dl-param-search {
      width: 100%;
      background: rgba(22, 33, 62, 0.7);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 0.82rem;
    }

    #dl-param-search::placeholder { color: var(--text-dim); }
    #dl-param-search:focus { outline: 2px solid var(--accent); }

    #dl-analysis-time {
      font-size: 0.72rem;
      color: var(--text-dim);
      min-height: 1em;
    }

    #dl-param-list {
      width: 100%;
      min-height: 90px;
      max-height: 120px;
      background: rgba(22, 33, 62, 0.7);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      font-size: 0.8rem;
      overflow-y: auto;
    }

    input[type="number"]#dl-timesteps {
      width: 100%;
      background: rgba(22, 33, 62, 0.7);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 0.82rem;
    }

    input[type="number"]#dl-timesteps:focus { outline: 2px solid var(--accent); }

    #dl-download-btn {
      width: 100%;
      background: var(--accent2);
      border: none;
      color: #fff;
      border-radius: 6px;
      padding: 9px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 2px;
    }

    #dl-download-btn:hover:not(:disabled) { opacity: 0.85; }
    #dl-download-btn:disabled { opacity: 0.45; cursor: not-allowed; }

    #dl-status {
      font-size: 0.73rem;
      color: var(--text-dim);
      min-height: 1em;
      line-height: 1.5;
      word-break: break-word;
    }

    #dl-status a { color: var(--accent); }

    /* ── Cesium UI overrides ── */
    /* Hide built-in widgets — we use the sidebar instead */
    .cesium-viewer-toolbar,
    .cesium-viewer-animationContainer,
    .cesium-viewer-timelineContainer { display: none !important; }

    /* Dark-tinted credit bar */
    .cesium-viewer-bottom {
      background: rgba(13, 13, 26, 0.55) !important;
      font-size: 0.65rem !important;
      backdrop-filter: blur(6px);
    }
  </style>
</head>
<body>

  <!-- Globe sits behind everything -->
  <div id="globe">
    <div id="map-spinner">Rendering…</div>
  </div>

  <!-- Download toolbar — top-right floating panel (WIP: hidden until downloader is stable) -->
  <div id="download-panel" class="panel" style="display:none">
    <button id="dl-toggle"><span>Download GRIB2</span><span class="arrow">▾</span></button>
    <div id="dl-body">

      <div class="ctrl-group" style="padding-top:10px">
        <label for="dl-producer">Producer</label>
        <select id="dl-producer"><option value="">— loading —</option></select>
        <div id="dl-gentime"></div>
      </div>

      <div class="ctrl-group">
        <label>Parameter</label>
        <input id="dl-param-search" type="text" placeholder="Search name or description…" autocomplete="off" />
        <select id="dl-param-list" size="5"></select>
        <div id="dl-param-info"></div>
      </div>

      <div class="ctrl-group">
        <label for="dl-geometry">Geometry</label>
        <select id="dl-geometry"></select>
        <div id="dl-analysis-time"></div>
      </div>

      <div class="ctrl-group">
        <label for="dl-timesteps">Timesteps</label>
        <input type="number" id="dl-timesteps" value="24" min="1" max="240" />
      </div>

      <button id="dl-download-btn">Save to server</button>
      <div id="dl-status"></div>

    </div>
  </div>

  <!-- Legend — top-left floating panel -->
  <div id="legend-panel" class="panel">
    <span>Legend</span>
    <img id="legend-img" src="" alt="legend" style="display:none" />
  </div>

  <!-- Sidebar — bottom-left floating panel -->
  <aside id="sidebar" class="panel">
    <div id="sidebar-header">
      <h1>Weather Visualizer</h1>
      <p>GRIB2 data explorer</p>
    </div>

    <div id="sidebar-body">
      <div class="ctrl-group">
        <label for="var-select">Variable</label>
        <select id="var-select">
          <option value="">— loading —</option>
        </select>
      </div>

      <div class="ctrl-group" id="time-ctrl" style="display:none">
        <label for="time-slider">Time step</label>
        <input type="range" id="time-slider" min="0" max="0" value="0" />
        <div id="time-label"></div>
      </div>
    </div>

    <div id="info-panel">
      <button id="info-toggle"><span>Data info</span><span class="arrow">▾</span></button>
      <div id="info-body"></div>
    </div>

    <div id="status-bar">Click the globe to query a point.</div>
  </aside>

  <!-- Chart panel — bottom-right floating panel -->
  <div id="chart-panel" class="panel">
    <button id="chart-close" title="Close">×</button>
    <div id="chart-title">Click the globe to see a timeseries at that point.</div>
    <div id="chart-wrap">
      <canvas id="timechart"></canvas>
      <div id="no-data-msg">No data — click a point on the globe</div>
    </div>
  </div>

<script src="app.js"></script>
</body>
</html>

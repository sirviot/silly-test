server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # GRIB2 downloads can be large — give them 5 minutes and skip the cache.
    # This location must appear before the general proxy block so nginx matches it first.
    location ~ ^/smartmet/download {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
        proxy_cache off;
    }

    # All other API and SmartMet proxy routes (tile-cached where useful)
    location ~ ^/(wms|variables|data|health|info|smartmet) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;

        proxy_cache tile_cache;
        proxy_cache_key "$request_uri";
        proxy_cache_valid 200 2h;
        proxy_cache_use_stale error timeout;
        add_header X-Cache $upstream_cache_status;
    }

    # Serve static frontend files
    location / {
        try_files $uri $uri/ /index.html;
    }
}

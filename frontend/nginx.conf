server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy API and WMS requests to the backend
    location ~ ^/(wms|variables|data|health|info) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;

        proxy_cache tile_cache;
        proxy_cache_key "$request_uri";   # full URL = unique per tile
        proxy_cache_valid 200 2h;         # cache successful responses for 2 hours
        proxy_cache_use_stale error timeout; # serve stale on backend error
        add_header X-Cache $upstream_cache_status; # HIT/MISS visible in devtools
    }

    # Serve static frontend files
    location / {
        try_files $uri $uri/ /index.html;
    }
}
